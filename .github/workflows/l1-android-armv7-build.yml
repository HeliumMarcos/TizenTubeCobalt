name: L1 Android ARMv7 APK build

on:
  push:
    branches:
      - upgrade/cobalt-27-lts-11
      - feature/l1-media-capabilities
    paths:
      - '.github/workflows/l1-android-armv7-build.yml'
      - 'cobalt/android/apk/app/src/main/java/dev/cobalt/media/**'
      - 'third_party/blink/renderer/core/dom/document.cc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            cobalt/android/BUILD.gn
            cobalt/build/gn.py
            cobalt/build/configs/android-arm
            cobalt/build/configs/android_common.gn
            cobalt/version.h
            starboard/android/shared/BUILD.gn
            starboard/android/shared/exoplayer
            cobalt/android/apk/app/src/main/java/dev/cobalt/media
            third_party/blink/renderer/core/dom/document.cc
            .github/config/android-arm.json
      - name: Verify ARMv7 APK target and source wiring (not a compilation)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('.github/config/android-arm.json').read_text())
          assert cfg['platforms'] == ['android-arm']
          assert cfg['test_root_target'] == '//cobalt/android:cobalt_apk'

          gnargs = Path('cobalt/build/configs/android-arm/args.gn').read_text()
          assert 'target_cpu = "arm"' in gnargs

          version = Path('cobalt/version.h').read_text()
          is_lts_11 = '#define COBALT_VERSION "27.lts.11"' in version
          is_lts_10 = '#define COBALT_VERSION "27.lts.10"' in version
          assert is_lts_11 or is_lts_10

          build = Path('cobalt/android/BUILD.gn').read_text()
          assert 'android_apk("cobalt_apk")' in build
          if is_lts_11:
              assert 'androidx_media3_media3_exoplayer_java' in build
              assert 'media/ExoPlayerBridge.java' in build
              assert 'media/ExoPlayerManager.java' in build
              native = Path('starboard/android/shared/BUILD.gn').read_text()
              assert 'exoplayer/exoplayer_bridge.cc' in native
              assert Path('starboard/android/shared/exoplayer/exoplayer_bridge.cc').is_file()

          for fpath in [
              'cobalt/android/apk/app/src/main/java/dev/cobalt/media/AudioOutputManager.java',
              'cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java',
              'third_party/blink/renderer/core/dom/document.cc',
          ]:
              p = Path(fpath)
              assert p.is_file(), f'Missing {fpath}'
              raw = p.read_bytes()
              assert not raw.startswith(b'\xff\xfe') and not raw.startswith(b'\xef\xbb\xbf'), f'BOM detected in {fpath}'
              raw.decode('utf-8')

          print('Source readiness PASS: Android ARMv7 APK target and media files verified (UTF-8 clean).')
          PY

  build-apk-armv7:
    needs: source-readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_REPORT_BUILD: '0'
      DEPOT_TOOLS_COLLECT_METRICS: '0'
      DEPOT_TOOLS_METRICS: '0'
      GCLIENT_PY3: '1'
    steps:
      - name: Free runner disk space for Chromium/Cobalt Android build
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /usr/local/graalvm \
            /usr/local/.ghcup || true
          df -h

      - name: Install depot_tools and system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git python3 python3-dev python3-pip ninja-build openjdk-17-jdk-headless \
            zip unzip curl xz-utils zstd pkg-config libglib2.0-0 libnss3 gperf \
            libdbus-1-3 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 \
            libxtst6 libgbm1 libasound2t64 libxkbcommon0 libpango-1.0-0 \
            gcc-multilib g++-multilib bzip2 jq bison flex
          mkdir -p "$GITHUB_WORKSPACE/cobalt"
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$GITHUB_WORKSPACE/cobalt/depot_tools"
          git -C "$GITHUB_WORKSPACE/cobalt/depot_tools" checkout 4a978d8f1f3567d5bd729aec018bfc345a14e1cd
          echo "$GITHUB_WORKSPACE/cobalt/depot_tools" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          source "$GITHUB_WORKSPACE/cobalt/depot_tools/bootstrap_python3" && bootstrap_python3
          test -f "$GITHUB_WORKSPACE/cobalt/depot_tools/python3_bin_reldir.txt"
          build_telemetry opt-out || true
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          for dir in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE/../.." "$GITHUB_WORKSPACE/cobalt" "$GITHUB_WORKSPACE/cobalt/src"; do
            mkdir -p "$dir/.android"
            cp -f "$HOME/.android/debug.keystore" "$dir/.android/debug.keystore"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cobalt/src
          persist-credentials: false
          fetch-depth: 2

      - name: Clean conflicting sub-repositories and configure gclient for Android
        working-directory: cobalt
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          cd "$GITHUB_WORKSPACE/cobalt/src"
          git -c core.quotepath=false status --porcelain -unormal | while IFS= read -r line; do
            path="${line:3}"
            clean_path="${path%/}"
            if [[ -d "${clean_path}" && -d "${clean_path}/.git" ]]; then
              echo "Deleting conflicting sub-repo: ${clean_path}"
              rm -rf "${clean_path}"
            fi
          done
          cd "$GITHUB_WORKSPACE/cobalt"
          gclient config \
            --name=src \
            --custom-var="rbe_instance=\"projects/cobalt-actions-prod/instances/default_instance\"" \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "target_os=['android']" >> .gclient
          gclient validate

      - name: Synchronize Android dependencies
        working-directory: cobalt
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          gclient sync \
            --no-history \
            --shallow \
            --nohooks \
            --force \
            --delete_unversioned_trees \
            --revision "${GITHUB_SHA}" \
            --jobs 4
          gclient runhooks
          if [[ ! -f "$GITHUB_WORKSPACE/cobalt/depot_tools/python3_bin_reldir.txt" ]]; then
            source "$GITHUB_WORKSPACE/cobalt/depot_tools/bootstrap_python3" && bootstrap_python3
          fi

      - name: Generate GN files for Cobalt ARMv7
        working-directory: cobalt/src
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          rm -rf cobalt/shell/android/java/res/values-*
          for dir in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE/../.." "$GITHUB_WORKSPACE/cobalt" "$GITHUB_WORKSPACE/cobalt/src"; do
            mkdir -p "$dir/.android"
            cp -f "$HOME/.android/debug.keystore" "$dir/.android/debug.keystore"
          done
          python3 cobalt/build/gn.py -p android-arm -c devel --no-rbe --no-check
          gn args --list --short --overrides-only out/android-arm_devel
          test -f out/android-arm_devel/build.ninja
          echo 'GN generation completed for target_cpu=arm.'

      - name: Compile Java, JNI and native code; package test APK
        working-directory: cobalt/src
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/cobalt/depot_tools:$PATH"
          autoninja -j 4 -C out/android-arm_devel cobalt/android:cobalt_apk

      - name: Verify APK ABI and prepare artifact
        working-directory: cobalt/src
        run: |
          set -euo pipefail
          apk="$(find out/android-arm_devel/apks -maxdepth 1 -name '*.apk' -type f -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::Ninja completed but no APK was found."
            exit 1
          fi
          if ! zipinfo -1 "$apk" | grep -F 'lib/armeabi-v7a/' > /dev/null; then
            echo "::error::APK does not contain armeabi-v7a native libraries."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
          cp "$apk" "$GITHUB_WORKSPACE/build-artifacts/TizenTubeCobalt-armv7-test.apk"
          sha256sum "$GITHUB_WORKSPACE/build-artifacts/TizenTubeCobalt-armv7-test.apk" | tee "$GITHUB_WORKSPACE/build-artifacts/SHA256SUMS.txt"
          printf 'Commit: %s\nPlatform: android-arm\nGN target: //cobalt/android:cobalt_apk\nSource: %s\n' "$GITHUB_SHA" "$apk" > "$GITHUB_WORKSPACE/build-artifacts/BUILD-INFO.txt"

      - name: Upload test APK (no GitHub Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tizentube-cobalt-armv7-test-apk
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7
