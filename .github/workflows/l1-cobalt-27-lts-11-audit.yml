name: Audit Cobalt 27.lts.11 migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch official Cobalt 27.lts.11 tag
        run: |
          set -euo pipefail
          git remote add cobalt-official https://github.com/youtube/cobalt.git
          git fetch --no-tags --filter=blob:none cobalt-official refs/tags/27.lts.11:refs/tags/l1-official-27.lts.11
      - name: Generate migration impact report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-report
          printf 'Fork HEAD: %s\nOfficial tag: %s\n' "$(git rev-parse HEAD)" "$(git rev-parse refs/tags/l1-official-27.lts.11)" > migration-report/summary.txt
          git diff --stat HEAD refs/tags/l1-official-27.lts.11 -- cobalt starboard > migration-report/engine-diff-stat.txt || true
          git diff --name-status HEAD refs/tags/l1-official-27.lts.11 -- cobalt starboard > migration-report/engine-changed-paths.txt || true
          git diff HEAD refs/tags/l1-official-27.lts.11 -- cobalt/version.h > migration-report/version-diff.patch || true
          echo 'This is a read-only audit. It does NOT update the Cobalt engine.' >> migration-report/summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cobalt-27-lts-11-migration-audit
          path: migration-report/
          retention-days: 14
