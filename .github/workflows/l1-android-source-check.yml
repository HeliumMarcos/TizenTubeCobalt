name: L1 Android source preflight

on:
  pull_request:
    paths:
      - 'cobalt/android/**'
      - 'cobalt/version.h'
      - '.github/workflows/l1-android-source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cobalt/android
            cobalt/version.h
            .github/config/android-arm64.json
      - name: Check source and Android build target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("cobalt/android/apk/app/src/main/java/dev/cobalt/media")
          util = root / "MediaCodecUtil.java"
          bridge = root / "MediaCodecBridge.java"
          config = Path(".github/config/android-arm64.json")
          version = Path("cobalt/version.h")

          for file in (util, bridge, config, version):
              if not file.is_file():
                  raise SystemExit(f"Required source missing: {file}")

          data = json.loads(config.read_text())
          assert data["test_root_target"] == "//cobalt/android:cobalt_apk", "Unexpected Android APK target"
          assert "android-arm64" in data["platforms"], "ARM64 platform not configured"

          src = util.read_text()
          assert "L1 video support:" in src, "4K diagnostic missing"
          assert "L1 audio decode support:" in src, "Audio diagnostic missing"
          assert "getHdrStaticInfo(" in src, "Upstream HDR utility missing"

          for file in (util, bridge):
              text = file.read_text()
              for marker in ("<<<<<<<", "=======", ">>>>>>>"):
                  if any(line.startswith(marker) for line in text.splitlines()):
                      raise SystemExit(f"Merge conflict marker {marker} in {file}")

          print("L1 Android source preflight passed.")
          print("NOTE: This is NOT a Java/native compile or APK build.")
          print("Version:", next((line.strip() for line in version.read_text().splitlines()
                                  if "COBALT_VERSION " in line), "unknown"))
          PY
