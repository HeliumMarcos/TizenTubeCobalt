name: Integrate official Cobalt 27.lts.11

on:
  push:
    branches:
      - upgrade/cobalt-27-lts-11
    paths:
      - '.github/workflows/l1-cobalt-27-lts-11-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: l1-cobalt-27-lts-11-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.repository == 'HeliumMarcos/TizenTubeCobalt' && github.ref == 'refs/heads/upgrade/cobalt-27-lts-11'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/cobalt-27-lts-11
          fetch-depth: 1
          persist-credentials: true

      - name: Retrieve official upstream 27.lts.10 and 27.lts.11
        shell: bash
        run: |
          set -euo pipefail
          git remote add cobalt-official https://github.com/youtube/cobalt.git
          git -c protocol.version=2 fetch --no-tags --filter=blob:none cobalt-official \
            refs/tags/27.lts.10:refs/tags/l1-official-27.lts.10 \
            refs/tags/27.lts.11:refs/tags/l1-official-27.lts.11

      - name: Resolve reviewed conflicts and validate complete source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-report
          fork_head="$(git rev-parse HEAD)"
          base="$(git rev-parse refs/tags/l1-official-27.lts.10)"
          upstream="$(git rev-parse refs/tags/l1-official-27.lts.11)"

          python3 tools/l1-resolve-cobalt-27-lts-11-conflicts.py --self-test
          set +e
          git merge-tree --write-tree --name-only --merge-base="$base" "$fork_head" "$upstream" > integration-report/merge-tree.txt 2>&1
          status=$?
          set -e
          printf 'fork=%s\nbase=%s\nupstream=%s\nmerge-tree-status=%s\n' \
            "$fork_head" "$base" "$upstream" "$status" > integration-report/source-commits.txt
          cat integration-report/source-commits.txt
          if (( status > 1 )); then
            echo "::error::Merge-tree failure; no commit was created."
            exit 1
          fi
          tree="$(head -n 1 integration-report/merge-tree.txt)"
          if [[ ! "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected merge-tree result; no commit was created."
            exit 1
          fi

          if (( status == 1 )); then
            # Fail if the upstream/fork changed and any new conflicts arise.
            awk 'NR == 1 {next} NF == 0 {exit} {print}' integration-report/merge-tree.txt > integration-report/conflicts.txt
            python3 - <<'PY'
          from pathlib import Path
          expected = {
              "cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java",
              "cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java",
              "starboard/android/shared/base_starboard_bridge.cc",
          }
          actual = set(Path("integration-report/conflicts.txt").read_text().splitlines())
          if actual != expected:
              raise SystemExit(f"Unreviewed merge conflicts: {actual ^ expected}")
          print("All three reported merge conflicts are reviewed.")
          PY
          fi

          # Use a temporary Git index. Never materialize the entire Chromium tree
          # with read-tree -u: that is extremely expensive on hosted runners.
          export GIT_INDEX_FILE="$RUNNER_TEMP/l1-cobalt-merge.index"
          rm -f "$GIT_INDEX_FILE"
          echo "::notice::Loading merge result into an isolated Git index"
          git read-tree "$tree"

          if (( status == 1 )); then
            root="$(mktemp -d "$RUNNER_TEMP/l1-cobalt-conflicts.XXXXXX")"
            for file in \
              cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java \
              cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java \
              starboard/android/shared/base_starboard_bridge.cc; do
              mkdir -p "$root/$(dirname "$file")"
              git show "$tree:$file" > "$root/$file"
            done
            python3 tools/l1-resolve-cobalt-27-lts-11-conflicts.py --root "$root"
            for file in \
              cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java \
              cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java \
              starboard/android/shared/base_starboard_bridge.cc; do
              blob="$(git hash-object -w "$root/$file")"
              git update-index --add --cacheinfo "100644,$blob,$file"
            done
          fi

          # GitHub Actions' GITHUB_TOKEN cannot update .github/workflows in a
          # git push. Keep fork workflows unchanged in this source integration;
          # review upstream CI changes independently with appropriate access.
          git restore --source="$fork_head" --staged -- .github/workflows
          if [[ -n "$(git diff --cached --name-only "$fork_head" -- .github/workflows)" ]]; then
            echo "::error::Workflow diff remains; refusing unauthorized push."
            exit 1
          fi

          # Check only the three reviewed conflict resolutions. Upstream itself
          # includes unrelated pre-existing whitespace that must stay unchanged.
          git diff --cached --check "$fork_head" -- \
            cobalt/android/apk/app/src/main/java/dev/cobalt/coat/BaseStarboardBridge.java \
            cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java \
            starboard/android/shared/base_starboard_bridge.cc

          echo "::notice::Writing merged tree from isolated index"
          resolved_tree="$(git write-tree)"

          # Check blobs in the merged tree, NOT the original checkout (27.lts.10).
          check_contains() {
            local path="$1" expected="$2"
            # Do not use grep -q with pipefail: it can cause git show SIGPIPE.
            if ! git show "$resolved_tree:$path" | grep -F "$expected" > /dev/null; then
              echo "::error::Missing '$expected' in $path"
              exit 1
            fi
          }
          check_file() { git cat-file -e "$resolved_tree:$1"; }

          check_contains cobalt/version.h '#define COBALT_VERSION "27.lts.11"'
          check_contains cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecBridge.java 'MediaCodecUtil.getHdrStaticInfo('
          check_contains cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java 'L1 video support:'
          check_contains cobalt/android/apk/app/src/main/java/dev/cobalt/media/MediaCodecUtil.java 'L1 audio decode support:'
          check_contains starboard/android/shared/base_starboard_bridge.cc 'InstallAppFromURL('
          check_contains starboard/android/shared/base_starboard_bridge.cc 'OnPrimaryMainFrameNavigationStarted('
          check_contains .github/config/android-arm.json 'android-arm'
          check_file cobalt/android/apk/app/src/main/java/dev/cobalt/dial/DIALServer.java
          check_file cobalt/android/apk/app/src/main/java/dev/cobalt/media/ExoPlayerBridge.java
          check_file starboard/android/shared/exoplayer/exoplayer_bridge.cc
          echo "::notice::Merged tree integrity checks passed; preparing Git commit"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Squash the upstream SOURCE SNAPSHOT into the fork rather than pushing
          # all 166 official history commits (previous Git HTTPS push timed out 408).
          # The full upstream provenance is recorded in the commit message.
          merge_message="$(printf 'Integrate Cobalt 27.lts.11 source snapshot\n\nUpstream: youtube/cobalt tag 27.lts.11\nUpstream commit: %s\nMerge base: %s\nPreserve reviewed TizenTube JNI and codec customizations.\nThis is a source-tree integration (one parent), not a full-history merge.\n' "$upstream" "$base")"
          merge_commit="$(printf '%s\n' "$merge_message" | git commit-tree "$resolved_tree" -p "$fork_head")"
          echo "candidate-merge-commit=$merge_commit" | tee -a integration-report/source-commits.txt

          # No force: abort rather than overwrite any concurrent branch update.
          remote_head="$(git ls-remote origin refs/heads/upgrade/cobalt-27-lts-11 | awk '{print $1}')"
          if [[ "$remote_head" != "$fork_head" ]]; then
            echo "::error::Branch advanced; refusing to overwrite concurrent changes."
            exit 1
          fi
          git push origin "$merge_commit:refs/heads/upgrade/cobalt-27-lts-11"
          echo "Merged upstream 27.lts.11: $merge_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "Full Android compilation and hardware playback remain unverified." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve merge diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-27-lts-11-integration-report
          path: integration-report/
          retention-days: 14
